<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Evil Crown Publishing</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b0b0b;--panel:#151410;--line:#3a3022;--gold:#c6a15c;--gold2:#e0c283;--tx:#eee9df;--mut:#a9a194;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3{font-family:Georgia,serif;font-weight:500;margin:.3em 0}a{color:var(--gold2);cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap;gap:8px}
.brand{font-family:Georgia,serif;letter-spacing:2px;font-weight:700;cursor:pointer}.brand b{color:var(--gold);font-size:24px;margin-right:8px}
nav{display:flex;gap:14px;align-items:center;font-size:13px;flex-wrap:wrap}
main{max-width:980px;margin:auto;padding:28px 5vw 60px;animation:f .35s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
.btn{background:var(--gold);color:#17130d;border:0;padding:11px 20px;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:12px;cursor:pointer}.btn:disabled{opacity:.5}.btn.o{background:none;color:var(--gold2);border:1px solid var(--gold)}.btn.big{padding:15px 30px;font-size:14px}
.hero{text-align:center;padding:60px 0}.hero h1{font-size:clamp(38px,8vw,72px);line-height:1}.hero em{color:var(--gold2)}.tag{color:var(--gold);letter-spacing:3px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card,.fmt{background:var(--panel);border:1px solid var(--line);padding:20px}.fmt{cursor:pointer}.fmt:hover{border-color:var(--gold)}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}input,select,textarea{width:100%;background:#0b0b0b;border:1px solid #39332a;color:var(--tx);padding:11px;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.row{grid-template-columns:1fr}}
.cover{aspect-ratio:3/4;background:radial-gradient(circle at 50% 35%,#8d6c36,#1a150d 65%);display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-family:Georgia,serif;font-size:22px;border:1px solid #6a5632;margin-bottom:12px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}
.st{display:inline-block;font-size:10px;letter-spacing:1.5px;font-weight:700;padding:3px 9px;border:1px solid}.s-IN_REVIEW{color:#e0c283}.s-ACTION_NEEDED{color:#ff9a5c}.s-PUBLISHED{color:#6fd08c}.s-DECLINED{color:#ff6b6b}
table{width:100%;border-collapse:collapse}td{padding:8px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right}.tot td{font-weight:700;color:var(--gold2);font-size:18px;border:0}
.note{background:#2a1a10;border-left:3px solid #ff9a5c;padding:12px;margin:14px 0}.mut{color:var(--mut);font-size:12px}.err{color:#ff6b6b;font-size:13px}.ok{color:#6fd08c;font-size:13px}.sc{overflow-x:auto}
.bar{height:6px;background:#222;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold);width:0}
</style></head><body>
<header><div class="brand" onclick="go('home')"><b>♛</b>EVIL CROWN</div><nav id="nav"></nav></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== PASTE YOUR SUPABASE VALUES HERE (see SETUP.md) ===== */
const SUPABASE_URL='https://mhfllulgczeahxkhvoae.supabase.co';
const SUPABASE_KEY='sb_publishable_jJDMCIUqmCxM_gXXkGAe6Q_cZYQI5ka';
/* ========================================================== */
const BUCKET='manuscripts';
const ST={IN_REVIEW:'IN REVIEW',ACTION_NEEDED:'ACTION NEEDED',PUBLISHED:'PUBLISHED / LIVE',DECLINED:'DECLINED'};
const FM={ebook:'eBook',paperback:'Paperback',hardcover:'Hardcover'};
const $=s=>document.querySelector(s);
let sb,me=null,cfg=null,draft={},openId=null,urls={};
const go=p=>{location.hash=p};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const calc=(f,price,pages)=>{const c=cfg[f];let pr=0,h=0;if(f==='ebook')h=price*c.feePct/100;else{pr=c.print+c.perPage*(pages||0);h=c.handling}return{price,pr,h,total:price+pr+h}};
const bdHtml=q=>`<table><tr><td>Author price</td><td>${inr(q.price)}</td></tr>${q.pr?`<tr><td>Printing cost</td><td>${inr(q.pr)}</td></tr>`:''}<tr><td>${q.pr?'Handling charge':'Platform fee'}</td><td>${inr(q.h)}</td></tr><tr class="tot"><td>Final price</td><td>${inr(q.total)}</td></tr></table>`;
const isAdmin=()=>me&&me.role==='admin';

async function signedUrls(paths){const need=paths.filter(p=>p&&!urls[p]);if(!need.length)return;
  const {data}=await sb.storage.from(BUCKET).createSignedUrls(need,3600);(data||[]).forEach(d=>{if(d.signedUrl)urls[d.path]=d.signedUrl})}
function upl(path,file,cb){return new Promise(async(res,rej)=>{
  const {data}=await sb.auth.getSession();if(!data.session)return rej(new Error('Please log in again'));
  const x=new XMLHttpRequest();x.open('POST',`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`);
  x.setRequestHeader('Authorization','Bearer '+data.session.access_token);x.setRequestHeader('apikey',SUPABASE_KEY);
  x.upload.onprogress=e=>e.lengthComputable&&cb(Math.round(e.loaded/e.total*100));
  x.onload=()=>x.status<300?res():rej(new Error('Upload failed: '+x.responseText));x.onerror=()=>rej(new Error('Network error'));x.send(file)})}
const ext=n=>(n.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');

function nav(){let h='';
  if(me){h=(isAdmin()?`<a onclick="go('admin')">Admin</a>`:'')+`<a onclick="go('dashboard')">My books</a><a onclick="go('format')">Publish</a><a onclick="logout()">Log out (${esc(me.name)})</a>`}
  else h=`<a onclick="go('auth')">Login</a><button class="btn" onclick="go('auth')">Sign up</button>`;
  $('#nav').innerHTML=h}
async function logout(){await sb.auth.signOut();me=null;urls={};go('home');route()}
async function loadMe(){const {data:{session}}=await sb.auth.getSession();
  if(!session){me=null;return}
  const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).single();me=data||null;
  const s=await sb.from('settings').select('data').eq('id',1).single();cfg=s.data?s.data.data:null}

const card=b=>`<div class="card" style="cursor:pointer" onclick="openId='${b.id}';go('detail')">${cov(b)}<span class="st s-${b.status}">${ST[b.status]}</span><h3>${esc(b.title)}</h3><div class="mut">${esc(b.author_name)}<br>${FM[b.format]} · ${b.created_at.slice(0,10)}<br>Selling price ${inr(calc(b.format,+b.price,b.pages).total)}</div></div>`;
const cov=b=>`<div class="cover">${urls[b.cover_path]?`<img src="${urls[b.cover_path]}" alt="">`:esc(b.title)}</div>`;

const V={
home:async()=>`<div class="hero"><div class="tag">PREMIUM SELF-PUBLISHING HOUSE</div><h1>Welcome to<br><em>Evil Crown Publishing</em></h1><p class="mut" style="font-size:18px">Your Story. Your Crown. Your Legacy.</p><p style="max-width:520px;margin:18px auto;color:#bdb5a7">Publish your eBook, paperback or hardcover. See every charge up front and track your review.</p><button class="btn big" onclick="go('auth')">Sign up</button> <button class="btn o big" onclick="go('auth')">Login</button></div><div class="grid"><div class="card"><h3>eBook</h3><p class="mut">PDF, DOCX or EPUB + cover.</p></div><div class="card"><h3>Paperback</h3><p class="mut">Printed and shipped.</p></div><div class="card"><h3>Hardcover</h3><p class="mut">Premium bound edition.</p></div></div>`,
auth:async()=>`<div class="card" style="max-width:420px;margin:auto"><h2>Author account</h2><button class="btn o" style="width:100%;margin-bottom:8px" onclick="oauth('google')">Continue with Google</button><button class="btn o" style="width:100%" onclick="oauth('apple')">Continue with Apple</button><label>Name (sign up only)</label><input id="n"><label>Email</label><input id="e" type="email"><label>WhatsApp number</label><input id="w" placeholder="+91…"><label>Password (min 8)</label><input id="p" type="password"><div class="err" id="er"></div><p><button class="btn" id="b1" onclick="doAuth(1)">Sign up</button> <button class="btn o" id="b0" onclick="doAuth(0)">Login</button></p><p class="mut">After signing up, open the verification link sent to your email, then log in.</p></div>`,
format:async()=>`<h2>Choose your publishing format</h2><div class="grid">${[['ebook','eBook','Digital. PDF/DOCX/EPUB + cover.'],['paperback','Paperback','Print edition. Manuscript, cover, specs.'],['hardcover','Hardcover','Premium hardback. Manuscript, cover, specs.']].map(f=>`<div class="fmt" onclick="draft={format:'${f[0]}'};go('submit')"><h3>${f[1]}</h3><p class="mut">${f[2]}</p></div>`).join('')}</div>`,
submit:async()=>{const f=draft.format;if(!f){go('format');return''}const p=f!=='ebook',d=draft,opt=(a,v)=>a.map(x=>`<option${v===x?' selected':''}>${x}</option>`).join('');
 return `<h2>${FM[f]} submission</h2><div class="card"><div class="row"><div><label>Book title *</label><input id="title" value="${esc(d.title)}"></div><div><label>Subtitle</label><input id="sub" value="${esc(d.sub)}"></div><div><label>Author name *</label><input id="author" value="${esc(d.author||(me&&me.name))}"></div><div><label>Genre *</label><select id="genre">${opt(['Fiction','Non-fiction','Poetry','Fantasy','Romance','Thriller','Self-help','Children','Other'],d.genre)}</select></div><div><label>Language *</label><input id="lang" value="${esc(d.lang||'English')}"></div><div><label>ISBN (optional)</label><input id="isbn" value="${esc(d.isbn)}"></div></div><label>Description *</label><textarea id="desc" rows="4">${esc(d.desc)}</textarea>${p?`<div class="row"><div><label>Page count *</label><input id="pages" type="number" min="24" value="${esc(d.pages)}"></div><div><label>Trim size</label><select id="size">${opt(['5 x 8 in','5.5 x 8.5 in','6 x 9 in','A5','A4'],d.size)}</select></div></div>`:''}<div class="row"><div><label>Cover image (JPG/PNG, max 8MB) *</label><input id="cover" type="file" accept="image/jpeg,image/png"></div><div><label>Manuscript (${p?'PDF/DOCX':'PDF/DOCX/EPUB'}, max 25MB) *</label><input id="ms" type="file" accept=".pdf,.docx,.epub"></div></div><div class="err" id="er"></div><p><button class="btn" onclick="toPricing()">Continue to pricing</button></p></div>`},
pricing:async()=>{const d=draft;if(!d.title){go('format');return''}const p=d.format!=='ebook';
 return `<h2>Pricing &amp; review</h2><div class="row"><div class="card"><h3>${esc(d.title)}</h3><p class="mut">${esc(d.author)} · ${FM[d.format]} · ${esc(d.genre)} · ${esc(d.lang)}${p?` · ${d.pages} pp · ${esc(d.size)}`:''}</p><p>${esc(d.desc)}</p><p class="mut">Cover: ${esc(d.coverFile.name)}<br>Manuscript: ${esc(d.msFile.name)}<br>ISBN: ${esc(d.isbn||'—')}</p></div><div class="card"><label>Your desired selling price (₹)</label><input id="price" type="number" min="1" value="${d.price||''}" oninput="draft.price=+this.value;bd()"><div id="bd">${bdHtml(calc(d.format,d.price||0,d.pages))}</div><label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" id="ok" style="width:auto"> I confirm these charges and the final price.</label><p><button class="btn big" id="pub" onclick="publish()">Publish book</button></p><div class="bar"><i id="pg"></i></div><div class="mut" id="pt"></div><div class="err" id="er"></div></div></div>`},
dashboard:async()=>{const {data,error}=await sb.from('books').select('*').eq('owner',me.id).order('created_at',{ascending:false});if(error)return`<p class="err">${esc(error.message)}</p>`;
 await signedUrls(data.map(b=>b.cover_path));return `<h2>My books</h2><p><button class="btn" onclick="go('format')">+ New book</button></p>${data.length?`<div class="grid">${data.map(card).join('')}</div>`:'<p class="mut">No submissions yet.</p>'}`},
detail:async()=>{const {data:b}=await sb.from('books').select('*,profiles(name,email,whatsapp)').eq('id',openId).single();if(!b){go('dashboard');return''}
 await signedUrls([b.cover_path]);const q=calc(b.format,+b.price,b.pages),pr=b.profiles||{};
 return `<p><a onclick="go('${isAdmin()?'admin':'dashboard'}')">← Back</a></p><div class="row"><div>${cov(b)}</div><div><span class="st s-${b.status}">${ST[b.status]}</span><h2>${esc(b.title)}</h2><p class="mut">${esc(b.subtitle)}</p><p>${esc(b.description)}</p><p class="mut">${esc(b.author_name)} · ${FM[b.format]} · ${esc(b.genre)} · ${esc(b.language)} · ISBN ${esc(b.isbn||'—')}${b.pages?` · ${b.pages} pp · ${esc(b.trim_size)}`:''}<br>Submitted ${b.created_at.slice(0,10)} · Payment: ${b.paid?'Paid':'Pending'}</p>${bdHtml(q)}${b.admin_note?`<div class="note"><b>Message from Evil Crown:</b><br>${esc(b.admin_note)}</div>`:''}${b.status==='ACTION_NEEDED'&&b.owner===me.id?`<div class="card"><h3>Resubmit corrected manuscript</h3><input id="ms" type="file" accept=".pdf,.docx,.epub"><div class="bar"><i id="pg"></i></div><div class="err" id="er"></div><p><button class="btn" onclick="resub('${b.id}')">Resubmit</button></p></div>`:''}${isAdmin()?`<div class="card"><h3>Admin</h3><p class="mut">Author: ${esc(pr.name)} · ${esc(pr.email)} · ${esc(pr.whatsapp)}</p><button class="btn o" onclick="dl('${b.manuscript_path}')">Download manuscript</button> <button class="btn o" onclick="dl('${b.cover_path}')">Download cover</button><label>Status</label><select id="stsel">${Object.keys(ST).map(k=>`<option value="${k}"${b.status===k?' selected':''}>${ST[k]}</option>`).join('')}</select><label>Note to author</label><textarea id="adn" rows="3">${esc(b.admin_note)}</textarea><label style="display:flex;gap:8px"><input type="checkbox" id="paid" style="width:auto"${b.paid?' checked':''}> Payment verified</label><div class="err" id="er"></div><p><button class="btn" onclick="upd('${b.id}')">Update</button></p></div>`:''}</div></div>`},
admin:async()=>{if(!isAdmin()){go('home');return''}const c=cfg;
 const {data}=await sb.from('books').select('*,profiles(name,email,whatsapp)').order('created_at',{ascending:false});const L=data||[];
 return `<h2>Admin dashboard</h2><div class="card"><h3>Charges</h3><div class="row">${['paperback','hardcover'].map(f=>`<div><b>${FM[f]}</b><label>Base printing ₹</label><input type="number" id="${f}p" value="${c[f].print}"><label>Per page ₹</label><input type="number" step=".1" id="${f}pp" value="${c[f].perPage}"><label>Handling ₹</label><input type="number" id="${f}h" value="${c[f].handling}"></div>`).join('')}</div><label>eBook platform fee %</label><input type="number" id="fee" value="${c.ebook.feePct}"><p><button class="btn" onclick="saveCfg()">Save charges</button></p></div><h3>All submissions (${L.length})</h3><div class="sc"><table>${L.map(b=>{const u=b.profiles||{};return `<tr><td><a onclick="openId='${b.id}';go('detail')">${esc(b.title)}</a><div class="mut">${esc(u.name)} · ${esc(u.email)} · ${esc(u.whatsapp)}</div></td><td>${FM[b.format]}</td><td><span class="st s-${b.status}">${ST[b.status]}</span></td><td>${b.paid?'Paid':'Unpaid'}</td><td>${inr(calc(b.format,+b.price,b.pages).total)}</td></tr>`}).join('')}</table></div>`}
};

async function oauth(p){await sb.auth.signInWithOAuth({provider:p,options:{redirectTo:location.origin+location.pathname}})}
async function doAuth(su){const e=$('#e').value.trim().toLowerCase(),p=$('#p').value,er=$('#er');er.className='err';
  if(!/^\S+@\S+\.\S+$/.test(e))return er.textContent='Enter a valid email';if(p.length<8)return er.textContent='Password must be 8+ characters';
  $('#b0').disabled=$('#b1').disabled=true;
  try{if(su){const n=$('#n').value.trim();if(!n)throw new Error('Enter your name');
      const {data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{name:n,whatsapp:$('#w').value.trim()},emailRedirectTo:location.origin+location.pathname}});
      if(error)throw error;if(!data.session){er.className='ok';er.textContent='Check your email and click the verification link, then log in.';$('#b0').disabled=$('#b1').disabled=false;return}}
    else{const {error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)throw error}
    await loadMe();go('format');route()}
  catch(x){er.textContent=x.message;$('#b0').disabled=$('#b1').disabled=false}}

function toPricing(){const f=draft.format,er=$('#er'),g=i=>$('#'+i)?$('#'+i).value.trim():'',d=draft;
  Object.assign(d,{title:g('title'),sub:g('sub'),author:g('author'),genre:g('genre'),lang:g('lang'),isbn:g('isbn'),desc:g('desc')});
  if(f!=='ebook'){d.pages=+g('pages');d.size=g('size')}
  if(!d.title||!d.author||!d.lang||!d.desc)return er.textContent='Fill all required fields.';
  if(f!=='ebook'&&!(d.pages>=24))return er.textContent='Print books need at least 24 pages.';
  const c=$('#cover').files[0]||d.coverFile,m=$('#ms').files[0]||d.msFile;
  if(!c||!m)return er.textContent='Upload both cover and manuscript.';
  if(!/\.(jpe?g|png)$/i.test(c.name))return er.textContent='Cover must be JPG or PNG.';
  if(!/\.(pdf|docx|epub)$/i.test(m.name)||(f!=='ebook'&&/epub$/i.test(m.name)))return er.textContent='Unsupported manuscript type.';
  if(m.size>25e6||c.size>8e6)return er.textContent='File too large (manuscript 25MB, cover 8MB max).';
  d.coverFile=c;d.msFile=m;go('pricing')}
function bd(){$('#bd').innerHTML=bdHtml(calc(draft.format,draft.price||0,draft.pages))}

async function publish(){const d=draft,er=$('#er');er.textContent='';
  if(!(d.price>0))return er.textContent='Enter your selling price.';if(!$('#ok').checked)return er.textContent='Please confirm the charges.';
  $('#pub').disabled=true;const id=crypto.randomUUID(),base=`${me.id}/${id}`,cp=`${base}/cover.${ext(d.coverFile.name)}`,mp=`${base}/manuscript.${ext(d.msFile.name)}`;
  const set=(t,n)=>{$('#pt').textContent=t;$('#pg').style.width=n+'%'};
  try{await upl(cp,d.coverFile,n=>set('Uploading cover… '+n+'%',n*.2));
    await upl(mp,d.msFile,n=>set('Uploading manuscript… '+n+'%',20+n*.8));
    const {error}=await sb.from('books').insert({id,owner:me.id,format:d.format,title:d.title,subtitle:d.sub||null,author_name:d.author,genre:d.genre,language:d.lang,isbn:d.isbn||null,description:d.desc,pages:d.pages||null,trim_size:d.size||null,price:d.price,cover_path:cp,manuscript_path:mp});
    if(error)throw error;draft={};go('dashboard')}
  catch(x){er.textContent=x.message;$('#pub').disabled=false}}
async function resub(id){const m=$('#ms').files[0],er=$('#er');if(!m||!/\.(pdf|docx|epub)$/i.test(m.name)||m.size>25e6)return er.textContent='Choose a PDF/DOCX/EPUB under 25MB.';
  const p=`${me.id}/${id}/manuscript-${Date.now()}.${ext(m.name)}`;
  try{await upl(p,m,n=>$('#pg').style.width=n+'%');const {error}=await sb.rpc('resubmit',{p_id:id,p_path:p});if(error)throw error;go('dashboard');route()}catch(x){er.textContent=x.message}}
async function dl(path){const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(path,60);if(error)return alert(error.message);window.open(data.signedUrl,'_blank')}
async function upd(id){const {error}=await sb.from('books').update({status:$('#stsel').value,admin_note:$('#adn').value||null,paid:$('#paid').checked}).eq('id',id);if(error)return $('#er').textContent=error.message;go('admin');route()}
async function saveCfg(){const v=i=>+$('#'+i).value||0,n={ebook:{feePct:v('fee')}};['paperback','hardcover'].forEach(f=>n[f]={print:v(f+'p'),perPage:v(f+'pp'),handling:v(f+'h')});
  const {error}=await sb.from('settings').update({data:n}).eq('id',1);if(error)return alert(error.message);cfg=n;alert('Saved')}

async function route(){let p=(location.hash||'#home').slice(1);if(!V[p])p='home';
  if(['format','submit','pricing','dashboard','detail','admin'].includes(p)&&!me)p='auth';
  nav();$('#app').innerHTML='<p class="mut">Loading…</p>';
  try{$('#app').innerHTML=await V[p]()}catch(x){$('#app').innerHTML=`<p class="err">${esc(x.message)}</p>`}window.scrollTo(0,0)}
(async()=>{
  if(SUPABASE_URL.includes('YOUR_')){$('#app').innerHTML='<div class="card"><h2>Almost there</h2><p>Open <b>index.html</b> in a text editor and paste your Supabase URL and anon key at the top of the script. See SETUP.md.</p></div>';return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);await loadMe();
  sb.auth.onAuthStateChange(async(ev)=>{if(ev==='SIGNED_IN'&&!me){await loadMe();route()}});
  window.addEventListener('hashchange',route);route()})();
</script></body></html>
